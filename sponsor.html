<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>赞助支持 - BEI-Ae创作辅助工具</title>
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('ae-theme');
                var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch(_) {}
        })();
    </script>
    <meta name="description" content="赞助支持 - BEI-Ae创作辅助工具，感谢你的支持">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:title" content="赞助支持 - BEI-Ae创作辅助工具">
    <meta property="og:type" content="website">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        :root {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
            --accent: #6366f1;
            --accent-light: #818cf8;
            --alipay: #1677ff;
            --wechat: #07c160;
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f14;
            --bg-secondary: #1a1a24;
            --bg-card: rgba(30, 30, 42, 0.8);
            --text-primary: #f0f0f5;
            --text-secondary: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(99, 102, 241, 0.2); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration::before,
        .bg-decoration::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }

        .bg-decoration::before {
            width: 400px;
            height: 400px;
            background: var(--alipay);
            top: -100px;
            left: -100px;
        }

        .bg-decoration::after {
            width: 350px;
            height: 350px;
            background: var(--wechat);
            bottom: -80px;
            right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* 顶部导航 */
        .header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 32px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .logo:hover {
            opacity: 0.8;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
            transition: transform 0.3s;
        }
        .logo:hover .logo-icon { transform: scale(1.05) rotate(-3deg); }

        .theme-toggle {
            width: 40px;
            height: 40px;
            min-width: 40px;
            min-height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }

        /* 主内容 */
        .main {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }

        .hero {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease-out;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 100px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 17px;
            color: var(--text-secondary);
            line-height: 1.8;
            max-width: 560px;
            margin: 0 auto;
        }

        .quote {
            margin-top: 24px;
            font-size: 15px;
            color: var(--text-secondary);
            font-style: italic;
            opacity: 0.8;
        }

        /* 二维码卡片 */
        .qr-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-bottom: 50px;
        }

        .qr-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.8s ease-out backwards;
            position: relative;
            overflow: hidden;
        }

        .qr-card:nth-child(1) { animation-delay: 0.1s; }
        .qr-card:nth-child(2) { animation-delay: 0.2s; }

        .qr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--card-color), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .qr-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .qr-card:hover::before {
            opacity: 1;
        }

        .qr-card.alipay { --card-color: var(--alipay); }
        .qr-card.wechat { --card-color: var(--wechat); }

        .qr-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 16px;
            color: white;
        }

        .alipay .qr-icon { background: linear-gradient(135deg, #1677ff, #4096ff); }
        .wechat .qr-icon { background: linear-gradient(135deg, #07c160, #22c55e); }

        .qr-card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .qr-card .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .qr-image-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
            border-radius: 16px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .qr-card:hover .qr-image-wrapper {
            transform: scale(1.03);
        }

        .qr-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .qr-tip {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .qr-tip .scan-icon {
            font-size: 16px;
        }

        /* 感谢区 */
        .thanks {
            text-align: center;
            padding: 40px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            animation: fadeInUp 0.8s ease-out 0.3s backwards;
        }

        .thanks h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .thanks p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .hearts {
            font-size: 24px;
            letter-spacing: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            min-height: 48px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .header {
                padding: 16px 20px;
                padding-top: max(16px, env(safe-area-inset-top));
            }

            .main {
                padding: 40px 16px 60px;
                padding-bottom: max(60px, calc(env(safe-area-inset-bottom) + 40px));
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 15px;
            }

            .qr-cards {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .qr-card {
                padding: 28px 20px;
            }

            .qr-image-wrapper {
                width: 200px;
                height: 200px;
            }

            .thanks {
                padding: 28px 20px;
            }

            .image-modal .modal-close {
                top: max(16px, calc(env(safe-area-inset-top) + 8px));
                right: 16px;
                width: 44px; height: 44px; min-width: 44px; min-height: 44px;
            }
        }

        /* 图片可点击 */
        .qr-image-wrapper {
            cursor: zoom-in;
        }

        /* 图片放大预览遮罩 */
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            cursor: zoom-out;
        }

        .image-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            object-fit: contain;
        }

        .image-modal.active img {
            transform: scale(1);
        }

        .image-modal .modal-close {
            position: absolute;
            top: max(24px, calc(env(safe-area-inset-top) + 12px));
            right: 24px;
            width: 48px;
            height: 48px;
            min-width: 48px;
            min-height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .image-modal .modal-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(90deg);
        }

        .image-modal .modal-tip {
            position: absolute;
            bottom: max(30px, calc(env(safe-area-inset-bottom) + 16px));
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>

    <header class="header">
        <div class="logo" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">
            <div class="logo-icon">🎨</div>
            <span>BEI-Ae创作辅助工具</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
            <span id="themeIcon">🌙</span>
        </button>
    </header>

    <main class="main">
        <div class="hero">
            <div class="hero-badge">
                <span>💝</span>
                <span>感谢你的支持</span>
            </div>
            <h1>赞助支持</h1>
            <p>你的每一份支持都是我持续更新的动力。如果这个工具对你有帮助，欢迎请我喝杯咖啡 ☕</p>
            <div class="quote">"海内存知己，天涯若比邻"</div>
        </div>

        <div class="qr-cards">
            <div class="qr-card alipay">
                <div class="qr-icon">💙</div>
                <h3>支付宝</h3>
                <div class="subtitle">推荐使用，扫码即可赞助</div>
                <div class="qr-image-wrapper" onclick="openImageModal('sponsor/alipay.jpg', '支付宝收款码')">
                    <img src="sponsor/alipay.jpg" alt="支付宝收款码" loading="lazy">
                </div>
                <div class="qr-tip">
                    <span class="scan-icon">📱</span>
                    <span>打开支付宝扫一扫</span>
                </div>
            </div>

            <div class="qr-card wechat">
                <div class="qr-icon">💚</div>
                <h3>微信赞赏</h3>
                <div class="subtitle">微信扫码，随心赞赏</div>
                <div class="qr-image-wrapper" onclick="openImageModal('sponsor/wechat.png', '微信赞赏码')">
                    <img src="sponsor/wechat.png" alt="微信赞赏码" loading="lazy">
                </div>
                <div class="qr-tip">
                    <span class="scan-icon">📱</span>
                    <span>长按识别或扫一扫</span>
                </div>
            </div>
        </div>

        <div class="thanks">
            <h2>感谢有你 🙏</h2>
            <p>无论金额大小，每一份赞助都让我更有动力持续优化这个工具。<br>你的支持是我最大的鼓励！</p>
            <div class="hearts">❤️ 💛 💚 💙 💜</div>
            <button class="back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">
                <span>←</span>
                <span>返回上一页</span>
            </button>
        </div>
    </main>

    <!-- 图片放大预览遮罩 -->
    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
        <button class="modal-close" onclick="closeImageModal()">✕</button>
        <img id="modalImage" src="" alt="">
        <div class="modal-tip" id="modalTip">点击任意位置关闭</div>
    </div>

    <script>
        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('ae-theme', next);
            document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
        }

        // 初始化主题（与主页面共用 ae-theme key）
        (function() {
            const saved = localStorage.getItem('ae-theme');
            const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
        })();

        // 图片放大预览
        function openImageModal(src, alt) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const modalTip = document.getElementById('modalTip');
            modalImg.src = src;
            modalImg.alt = alt || '';
            modalTip.textContent = alt ? alt + ' · 点击任意位置关闭' : '点击任意位置关闭';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ESC键关闭预览
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImageModal();
            }
        });
    </script>
</body>
</html>
