<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>BEI-Ae 创作辅助工具 · 多平台导航站</title>
<meta name="description" content="BEI-Ae 创作辅助工具多平台部署导航站 - 快速访问 Netlify、GitHub Pages、Cloudflare Pages 等多个镜像站点">
<meta name="keywords" content="BEI-Ae,AE特效,导航站,镜像站点,Netlify,GitHub Pages,Cloudflare">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f0f2f5;
    --bg-card: #ffffff;
    --bg-elevated: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --text-tertiary: #9ca3af;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-soft: rgba(99,102,241,0.08);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
    --shadow-hover: 0 12px 40px rgba(0,0,0,0.10);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  [data-theme="dark"] {
    --bg: #0a0a14;
    --bg-card: #141424;
    --bg-elevated: #1a1a2e;
    --text: #e8e8f0;
    --text-secondary: #9ca3af;
    --text-tertiary: #6b7280;
    --border: #252540;
    --border-strong: #353560;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
    --accent-soft: rgba(129,140,248,0.1);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-hover: 0 12px 40px rgba(0,0,0,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  *::selection { background: var(--accent-soft); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    transition: background var(--transition), color var(--transition);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* 背景装饰 */
  .bg-decor {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bg-decor::before, .bg-decor::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
  }
  .bg-decor::before {
    width: 500px; height: 500px;
    background: #6366f1;
    top: -150px; left: -100px;
  }
  .bg-decor::after {
    width: 400px; height: 400px;
    background: #a855f7;
    bottom: -100px; right: -80px;
  }
  [data-theme="dark"] .bg-decor::before { opacity: 0.08; }
  [data-theme="dark"] .bg-decor::after { opacity: 0.08; }

  /* 顶部导航 */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: color-mix(in srgb, var(--bg-card) 80%, transparent);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
  }
  .header-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 17px;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; font-weight: 800;
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
  }
  .search-box {
    flex: 1;
    max-width: 380px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .search-box input::placeholder { color: var(--text-tertiary); }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: var(--bg-card);
  }
  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    color: var(--text-tertiary);
    pointer-events: none;
  }
  .search-kbd {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 11px;
    color: var(--text-tertiary);
    background: var(--bg-card);
    font-family: monospace;
    pointer-events: none;
  }
  .theme-toggle {
    width: 40px; height: 40px;
    min-width: 40px; min-height: 40px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle svg { width: 18px; height: 18px; }

  /* 快速跳转栏 */
  .quick-nav {
    max-width: 1120px;
    margin: 20px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .quick-nav a {
    padding: 7px 14px;
    min-height: 36px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .quick-nav a:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .quick-nav a .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  /* 主内容 */
  .container {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 24px 60px;
    position: relative;
    z-index: 1;
  }
  .hero {
    text-align: center;
    margin-bottom: 40px;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .hero-badge .pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }
  .hero h1 {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p {
    color: var(--text-secondary);
    font-size: 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }

  /* 卡片 */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0;
    box-shadow: var(--shadow);
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: var(--card-color, var(--accent));
  }
  .card-banner {
    height: 4px;
    background: var(--card-color, var(--accent));
    opacity: 0.8;
  }
  .card-body {
    padding: 24px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .card-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--card-color) 12%, transparent);
    color: var(--card-color);
    flex-shrink: 0;
  }
  .card-icon svg { width: 22px; height: 22px; }
  .card-title-area {
    flex: 1;
    min-width: 0;
  }
  .card h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .card .platform-label {
    font-size: 12px;
    color: var(--text-tertiary);
    font-weight: 500;
  }
  .card .desc {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .card .url-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 8px 12px;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .card .url {
    font-size: 12px;
    color: var(--text-secondary);
    word-break: break-all;
    font-family: "SF Mono", "Consolas", "Monaco", monospace;
    flex: 1;
    line-height: 1.4;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #22c55e;
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
    animation: status-pulse 2.5s infinite;
  }
  @keyframes status-pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
    50% { box-shadow: 0 0 0 6px rgba(34,197,94,0.05); }
  }

  /* 二维码区域 */
  .qr-section {
    margin-bottom: 18px;
  }
  .qr-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid var(--border);
    position: relative;
  }
  [data-theme="dark"] .qr-wrapper {
    background: #fff;
  }
  .qr-wrapper canvas, .qr-wrapper img {
    display: block !important;
    border-radius: 4px;
  }
  .qr-download {
    position: absolute;
    top: 8px; right: 8px;
    width: 28px; height: 28px;
    border: none;
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    opacity: 0;
  }
  .card:hover .qr-download { opacity: 1; }
  .qr-download:hover { color: var(--accent); background: var(--accent-soft); }
  .qr-download svg { width: 14px; height: 14px; }

  /* 按钮 */
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: auto;
  }
  .btn {
    flex: 1;
    padding: 11px 16px;
    min-height: 44px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary {
    background: var(--card-color, var(--accent));
    color: #fff;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px color-mix(in srgb, var(--card-color, var(--accent)) 40%, transparent);
    filter: brightness(1.08);
  }
  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    border-color: var(--card-color, var(--accent));
    color: var(--card-color, var(--accent));
  }
  .btn-secondary.copied {
    background: #22c55e;
    color: #fff;
    border-color: #22c55e;
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-tertiary);
    display: none;
  }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state p { font-size: 15px; margin: 0; }
  .empty-state .empty-state-sub { font-size: 13px; opacity: 0.8; margin-top: 6px; }

  /* Footer */
  footer {
    text-align: center;
    padding: 32px 24px;
    color: var(--text-tertiary);
    font-size: 13px;
    border-top: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }
  footer a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s;
  }
  footer a:hover { color: var(--accent); }

  /* 返回主站按钮 */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    min-height: 40px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    box-shadow: 0 2px 10px rgba(99,102,241,0.25);
    white-space: nowrap;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .back-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    filter: brightness(1.08);
  }
  .back-btn svg { width: 15px; height: 15px; }

  /* 子导航栏 */
  .sub-nav {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
    padding-top: 16px;
  }
  .sub-nav a {
    padding: 7px 14px;
    min-height: 36px;
    background: linear-gradient(135deg, var(--bg-card), var(--bg-elevated));
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .sub-nav a:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .toast svg { width: 16px; height: 16px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 入场动画 */
  .card {
    animation: cardIn 0.5s cubic-bezier(0.4,0,0.2,1) backwards;
  }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.12s; }
  .card:nth-child(3) { animation-delay: 0.19s; }
  .card:nth-child(4) { animation-delay: 0.26s; }
  .card:nth-child(5) { animation-delay: 0.33s; }
  .card:nth-child(6) { animation-delay: 0.40s; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-inner { flex-wrap: wrap; padding: 12px 16px; gap: 10px; padding-top: max(12px, env(safe-area-inset-top)); }
    .back-btn { padding: 6px 12px; font-size: 12px; order: 1; min-height: 38px; }
    .logo { order: 2; flex: 1; justify-content: center; }
    .search-box { order: 4; max-width: 100%; flex-basis: 100%; }
    .search-box input { font-size: 16px !important; min-height: 42px; } /* 防止iOS输入自动缩放 */
    .theme-toggle { order: 3; width: 40px; height: 40px; min-width: 40px; min-height: 40px; }
    .search-kbd { display: none; }
    .hero h1 { font-size: 24px; }
    .hero p { font-size: 14px; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .container { padding: 24px 16px 40px; padding-bottom: max(40px, calc(env(safe-area-inset-bottom) + 24px)); }
    .quick-nav { padding: 0 16px; }
    .sub-nav { padding: 12px 16px 0; }
    .quick-nav a, .sub-nav a { min-height: 38px; }
    .sub-nav a { padding: 6px 12px; font-size: 12px; }
    .card-body { padding: 20px; }
    .btn { min-height: 46px; font-size: 14px; }
    .qr-download { width: 36px; height: 36px; top: 10px; right: 10px; }
    footer { font-size: 12px; padding: 24px 16px; padding-bottom: max(24px, calc(env(safe-area-inset-bottom) + 16px)); }
  }

  @media (max-width: 380px) {
    .back-btn span { display: none; }
    .back-btn { padding: 6px 10px; }
    .logo { font-size: 15px; }
    .logo-icon { width: 32px; height: 32px; font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="bg-decor"></div>

<header class="header">
  <div class="header-inner">
    <a href="../index.html" class="back-btn" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回主站
    </a>
    <div class="logo">
      <div class="logo-icon">B</div>
      <span>BEI-Ae 导航</span>
    </div>
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
      <input type="text" id="searchInput" placeholder="搜索平台或网址..." aria-label="搜索平台" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" inputmode="search">
      <span class="search-kbd">Ctrl K</span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换深色/浅色主题">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
    </button>
  </div>
</header>

<!-- 子页面快速跳转 -->
<div class="sub-nav">
  <a href="../index.html" rel="noopener noreferrer">🎬 特效速查</a>
  <a href="../text-gallery/index.html" rel="noopener noreferrer">📄 文本动效手册</a>
  <a href="../gallery/index.html" rel="noopener noreferrer">🖼️ GIF 素材库</a>
  <a href="../sponsor.html" rel="noopener noreferrer">💝 赞助作者</a>
  <a href="../qq-group.html" rel="noopener noreferrer">💬 QQ交流群</a>
</div>

<div class="quick-nav" id="quickNav"></div>

<main class="container">
  <div class="hero">
    <div class="hero-badge">
      <span class="pulse"></span>
      <span>多平台在线 · 持续更新</span>
    </div>
    <h1>BEI-Ae 创作辅助工具</h1>
    <p>多平台部署入口 · 扫码访问或一键跳转</p>
  </div>

  <div class="grid" id="cardGrid"></div>

  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
    <p id="emptyStateTitle">没有找到匹配的平台</p>
    <p class="empty-state-sub" id="emptyStateSub">试试其他关键词或拼音首字母吧</p>
  </div>
</main>

<footer>
  <a href="../index.html" rel="noopener noreferrer">🏠 返回主站</a>
  <span style="margin:0 10px;opacity:0.3">|</span>
  BEI-Ae Creative Assistance Tool · 多平台镜像导航
</footer>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
  <span id="toastText">已复制到剪贴板</span>
</div>

<script>
  // 拼音首字母映射（常用字）
  const PINYIN_MAP = {
    "全":"Q","球":"Q","球加速":"QJS","加":"J","速":"S","开":"K","源":"Y","稳":"W","定":"D","可":"K","靠":"K",
    "边":"B","缘":"Y","网":"W","络":"L","极":"J","访":"F","问":"W","全":"Q","球":"Q","加":"J","速":"S","自":"Z",
    "动":"D","部":"B","署":"S","开":"K","源":"Y","托":"T","管":"G","边":"B","缘":"Y","计":"J","算":"S","网":"W",
    "络":"L","多":"D","平":"P","台":"T","镜":"J","像":"X","导":"D","航":"H","导":"D","航":"H","站":"Z","部":"B",
    "署":"S","入":"R","口":"K","扫":"S","码":"M","访":"F","问":"W","一":"Y","键":"J","跳":"T","转":"Z"
  };
  const pinyinCache = new Map();
  function getPinyinInitials(str) {
    if (!str) return "";
    if (pinyinCache.has(str)) return pinyinCache.get(str);
    let result = "";
    const chars = [...str];
    for (const ch of chars) {
      if (/[a-zA-Z0-9]/.test(ch)) {
        result += ch.toLowerCase();
      } else if (PINYIN_MAP[ch]) {
        result += PINYIN_MAP[ch].toLowerCase();
      }
    }
    pinyinCache.set(str, result);
    return result;
  }
  // 多字段搜索：精确 > 拼音首字母 > 模糊
  function multiFieldMatch(site, keyword) {
    const fields = [site.name, site.platform, site.url, site.desc];
    const kw = keyword.toLowerCase();
    // 1. 精确包含
    for (const f of fields) {
      if (f.toLowerCase().includes(kw)) return { match: true, priority: 0 };
    }
    // 2. 拼音首字母
    for (const f of fields) {
      const py = getPinyinInitials(f);
      if (py && py.includes(kw)) return { match: true, priority: 1 };
    }
    // 3. 拼音首字母每个字首字匹配
    for (const f of fields) {
      const py = getPinyinInitials(f);
      if (py && kw.split("").every((k, i) => py[i] === k)) return { match: true, priority: 2 };
    }
    return { match: false, priority: 99 };
  }

  const sites = [
    {
      name: "Netlify 部署",
      platform: "Netlify",
      url: "https://beishou.netlify.app/",
      desc: "全球 CDN 加速 · 自动 HTTPS",
      color: "#00C7B7",
      icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 2 19.6h6.8L12 13.2l3.2 6.4H22L12 2z"/></svg>'
    },
    {
      name: "GitHub Pages",
      platform: "GitHub",
      url: "https://bs1-make.github.io/BEI-AE-Creative-Assistance-Tool/",
      desc: "开源托管 · 稳定可靠",
      color: "#6366f1",
      icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.66-.22.66-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.33.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.16.58.67.48A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z"/></svg>'
    },
    {
      name: "Cloudflare Pages",
      platform: "Cloudflare",
      url: "https://bei-ae-creative-assistane-tool.pages.dev/",
      desc: "边缘网络 · 极速访问",
      color: "#F6821F",
      icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.3 13.8c.4-1.3-.5-2.2-1.4-2.7l.3-1.2c1.2.5 2.5 1.6 2.3 3.2-.1.5-.4 1-.9 1.4l-.3-.7zm-1.4-2.7.3-1.2c-1-.4-2.1-.5-3.1-.3l-.3 1.2c1-.2 2.1-.1 3.1.3zm5.3-1.2c-.2-1-.9-1.9-1.9-2.4.1-.5.1-1 .1-1.5C18.4 3.9 15.5 2 12 2S5.6 3.9 5.6 6.5c0 .3 0 .6.1.9C3.9 7.9 2.5 9.4 2.5 11.2c0 1.1.5 2.1 1.4 2.8-.3.5-.4 1.1-.4 1.6 0 2 1.8 3.5 4.1 3.5.4 0 .8-.1 1.2-.2.6.8 1.6 1.3 2.7 1.3 1.1 0 2.1-.5 2.7-1.3.4.1.8.2 1.2.2 2.3 0 4.1-1.6 4.1-3.5 0-.6-.2-1.1-.4-1.6.9-.7 1.4-1.7 1.4-2.8 0-.4-.1-.8-.2-1.2z"/></svg>'
    }
  ];

  const grid = document.getElementById("cardGrid");
  const quickNav = document.getElementById("quickNav");
  const searchInput = document.getElementById("searchInput");
  const emptyState = document.getElementById("emptyState");
  const themeToggle = document.getElementById("themeToggle");
  const themeIcon = document.getElementById("themeIcon");
  const toast = document.getElementById("toast");
  const toastText = document.getElementById("toastText");
  let searchTimer = null;

  const ICON_SUN = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>';
  const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

  // 主题切换
  function updateThemeIcon(theme) {
    themeIcon.innerHTML = theme === "dark" ? ICON_SUN : ICON_MOON;
  }
  let savedTheme;
  try {
    savedTheme = localStorage.getItem("dh-theme");
  } catch(_) { savedTheme = null; }
  savedTheme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", savedTheme);
  updateThemeIcon(savedTheme);
  themeToggle.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("dh-theme", next); } catch(_) {}
    updateThemeIcon(next);
  });

  // 渲染快速跳转栏
  sites.forEach((s, i) => {
    const a = document.createElement("a");
    a.innerHTML = `<span class="dot" style="background:${s.color}"></span>${s.platform}`;
    a.addEventListener("click", (e) => {
      e.preventDefault();
      const cards = document.querySelectorAll(".card");
      const idx = [...cards].findIndex(c => c.querySelector("h3")?.textContent === s.name);
      if (idx >= 0) cards[idx].scrollIntoView({ behavior: "smooth", block: "center" });
    });
    quickNav.appendChild(a);
  });

  // 二维码加载失败降级
  function fallbackQR(wrapper, url) {
    const fallback = document.createElement("div");
    fallback.style.cssText = "width:160px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;border:2px dashed var(--border);border-radius:8px;color:var(--text-secondary);font-size:12px;line-height:1.4;background:#fff;";
    fallback.innerHTML = `
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:8px;opacity:0.5">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <path d="M14 14h3v3h-3zM20 14h1v1h-1zM14 20h1v1h-1zM20 20h1v1h-1zM17 17h4v4h-4z"/>
      </svg>
      <div>二维码加载中...</div>
      <div style="font-size:11px;opacity:0.7;margin-top:4px;word-break:break-all;width:100%;">${url.substring(0, 30)}...</div>
    `;
    wrapper.insertBefore(fallback, wrapper.querySelector(".qr-download"));
  }

  // 渲染卡片
  function renderCards(filter = "") {
    grid.innerHTML = "";
    const keyword = filter.toLowerCase().trim();
    const results = sites.map(s => {
      const r = multiFieldMatch(s, keyword);
      return { site: s, match: r.match, priority: r.priority };
    }).filter(x => x.match).sort((a, b) => a.priority - b.priority).map(x => x.site);

    if (results.length === 0) {
      const title = document.getElementById('emptyStateTitle');
      const sub = document.getElementById('emptyStateSub');
      const q = keyword.trim();
      if (title) title.textContent = q ? `没有找到匹配「${q}」的平台` : '没有找到匹配的平台';
      if (sub) {
        if (/^[a-zA-Z]{2,}$/.test(q)) {
          sub.textContent = `提示：首字母「${q.toUpperCase()}」暂未命中，可试试平台全称`;
        } else if (q) {
          sub.textContent = '试试其他关键词或拼音首字母吧';
        } else {
          sub.textContent = '';
        }
      }
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    results.forEach((s) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.setProperty("--card-color", s.color);
      card.innerHTML = `
        <div class="card-banner"></div>
        <div class="card-body">
          <div class="card-header">
            <div class="card-icon">${s.icon}</div>
            <div class="card-title-area">
              <h3>${s.name}</h3>
              <span class="platform-label">${s.platform}</span>
            </div>
          </div>
          <p class="desc">${s.desc}</p>
          <div class="url-row">
            <span class="status-dot"></span>
            <span class="url">${s.url}</span>
          </div>
          <div class="qr-section">
            <div class="qr-wrapper" id="qr-${s.platform.replace(/[^a-zA-Z0-9]/g, '_')}">
              <button class="qr-download" title="下载二维码" data-platform="${s.platform}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </button>
            </div>
          </div>
          <div class="btn-group">
            <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              立即跳转
            </a>
            <button class="btn btn-secondary" data-url="${s.url}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              复制链接
            </button>
          </div>
        </div>
      `;
      grid.appendChild(card);

      const platId = s.platform.replace(/[^a-zA-Z0-9]/g, '_');
      const el = document.getElementById(`qr-${platId}`);
      if (el) {
        // 先显示降级提示
        fallbackQR(el, s.url);
        // 异步生成二维码
        setTimeout(() => {
          if (typeof QRCode !== "undefined") {
            try {
              // 移除降级内容
              const fb = el.querySelector('[style*="dashed"]');
              if (fb) fb.remove();
              el.querySelectorAll("canvas, img").forEach(n => n.remove());
              new QRCode(el, {
                text: s.url,
                width: 160,
                height: 160,
                colorDark: "#1a1a2e",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
              });
            } catch (err) {
              // 生成失败，保留降级提示
            }
          }
        }, 100);
      }
    });

    // 复制按钮
    document.querySelectorAll(".btn-secondary").forEach(btn => {
      btn.addEventListener("click", () => {
        const url = btn.getAttribute("data-url");
        const doCopy = (text) => {
          btn.classList.add("copied");
          const origHTML = btn.innerHTML;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>已复制';
          showToast("链接已复制到剪贴板");
          setTimeout(() => {
            btn.classList.remove("copied");
            btn.innerHTML = origHTML;
          }, 2000);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(() => doCopy(url)).catch(() => {
            const ta = document.createElement("textarea");
            ta.value = url; ta.style.position="fixed"; ta.style.top="-9999px";
            document.body.appendChild(ta); ta.select();
            try { document.execCommand("copy"); doCopy(url); } catch(_) { showToast("复制失败，请手动复制"); }
            document.body.removeChild(ta);
          });
        } else {
          const ta = document.createElement("textarea");
          ta.value = url; ta.style.position="fixed"; ta.style.top="-9999px";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); doCopy(url); } catch(_) { showToast("复制失败，请手动复制"); }
          document.body.removeChild(ta);
        }
      });
    });

    // 二维码下载
    document.querySelectorAll(".qr-download").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const platform = btn.getAttribute("data-platform").replace(/[^a-zA-Z0-9]/g, '_');
        const wrapper = document.getElementById(`qr-${platform}`);
        if (!wrapper) return;
        const canvas = wrapper.querySelector("canvas");
        const img = wrapper.querySelector("img");
        let dataUrl = null;
        if (canvas) {
          dataUrl = canvas.toDataURL("image/png");
        } else if (img && img.src) {
          dataUrl = img.src;
        }
        if (dataUrl) {
          const link = document.createElement("a");
          link.download = `bei-ae-${platform.toLowerCase()}-qr.png`;
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast("二维码已下载");
        } else {
          showToast("二维码生成中，请稍后再试");
        }
      });
    });
  }

  function showToast(msg) {
    toastText.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove("show"), 2000);
  }

  // 搜索 - 防抖 150ms
  searchInput.addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    const val = e.target.value;
    searchTimer = setTimeout(() => renderCards(val), 150);
  });

  // Ctrl+K 快捷键
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
    if (e.key === "Escape" && document.activeElement === searchInput) {
      searchInput.blur();
      if (searchInput.value) {
        searchInput.value = "";
        renderCards();
      }
    }
  });

  // 安全链接检查：rel="noopener noreferrer"
  document.querySelectorAll('a[target="_blank"]').forEach(a => {
    if (!a.rel || !a.rel.includes("noopener")) a.rel = "noopener noreferrer";
  });

  // 初始渲染
  renderCards();
</script>
