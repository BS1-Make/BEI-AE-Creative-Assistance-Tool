<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>AE 文本动效速查手册 - 333 独立动效预览</title>
<script>
    (function() {
        try {
            var saved = localStorage.getItem('ae-theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        } catch(_) {}
    })();
</script>
<meta name="description" content="AE文本动效速查手册 - 333个独立动效预览，支持文字搜索">
<meta name="theme-color" content="#6c5ce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="AE 文本动效速查手册 - 333 独立动效预览">
<meta property="og:type" content="website">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.json">
<link rel="preload" href="images/banner-hd.png" as="image">
<script src="split/cell_data.js"></script>
<style>
:root {
    --bg: #f4f4f8;
    --bg-card: #ffffff;
    --bg-header: rgba(255,255,255,0.82);
    --bg-glass: rgba(255,255,255,0.6);
    --text: #1a1a2e;
    --text-secondary: #6e6e80;
    --border: #e8e8ed;
    --border-strong: #d4d4dc;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --accent-dark: #5a4bd1;
    --accent-bg: rgba(108,92,231,0.08);
    --accent-glow: rgba(108,92,231,0.2);
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-hover: 0 8px 28px rgba(108,92,231,0.15);
    --shadow-card: 0 1px 4px rgba(0,0,0,0.04);
    --radius: 14px;
    --radius-sm: 10px;
    --gradient-accent: linear-gradient(135deg, #6c5ce7, #a29bfe);
}
[data-theme="dark"] {
    --bg: #0c0c12;
    --bg-card: #181820;
    --bg-header: rgba(18,18,26,0.85);
    --bg-glass: rgba(28,28,38,0.6);
    --text: #f0f0f5;
    --text-secondary: #9090a0;
    --border: #2a2a36;
    --border-strong: #3a3a4a;
    --accent: #a29bfe;
    --accent-light: #6c5ce7;
    --accent-dark: #5a4bd1;
    --accent-bg: rgba(162,155,254,0.12);
    --accent-glow: rgba(162,155,254,0.2);
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --shadow-hover: 0 8px 28px rgba(162,155,254,0.2);
    --shadow-card: 0 1px 4px rgba(0,0,0,0.2);
    --gradient-accent: linear-gradient(135deg, #a29bfe, #6c5ce7);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background 0.3s, color 0.3s;
    padding-bottom: 60px;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-glow); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }
body { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
body:hover { scrollbar-color: var(--accent) transparent; }
/* ===== Header ===== */
.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-header);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 8px;
    box-shadow: 0 1px 0 var(--border);
}
.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 1200px;
    margin: 0 auto;
}
.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}
.back-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    background: var(--accent-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    flex-shrink: 0;
    white-space: nowrap;
}
.back-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}
.back-btn .arrow { font-size: 16px; line-height: 1; }
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
}
.logo-icon {
    width: 38px; height: 38px;
    border-radius: 11px;
    background: var(--gradient-accent);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; font-weight: 800;
    flex-shrink: 0;
    box-shadow: 0 2px 12px var(--accent-glow);
    transition: transform 0.3s;
}
.logo:hover .logo-icon { transform: scale(1.05) rotate(-3deg); }
.logo-text { display: flex; flex-direction: column; line-height: 1.2; }
.logo-text small { font-size: 11px; color: var(--text-secondary); font-weight: 400; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.theme-toggle, .help-btn {
    background: var(--accent-bg);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 40px; height: 40px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s, background 0.2s, border-color 0.2s;
    flex-shrink: 0;
}
.theme-toggle:hover { transform: rotate(20deg); border-color: var(--accent); }
.theme-toggle:active { transform: rotate(180deg) scale(0.9); }
.help-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
/* ===== Search ===== */
.search-wrap {
    max-width: 1200px;
    margin: 10px auto 0;
    position: relative;
}
.search-wrap input {
    width: 100%;
    padding: 12px 80px 12px 44px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-card);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
}
.search-wrap input::placeholder { color: var(--text-secondary); opacity: 0.7; }
.search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-bg), 0 2px 8px var(--accent-glow);
}
.search-wrap .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: 0.5;
    transition: opacity 0.2s;
}
.search-wrap input:focus ~ .search-icon { opacity: 1; color: var(--accent); }
.search-shortcut {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
}
.search-wrap input:focus ~ .search-shortcut { opacity: 0; }
.search-clear {
    position: absolute;
    right: 50px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    font-size: 14px; cursor: pointer;
    color: var(--text-secondary);
    width: 26px; height: 26px;
    border-radius: 50%;
    display: none;
    align-items: center; justify-content: center;
}
.search-clear:hover { background: var(--accent-bg); color: var(--accent); }
.search-wrap input:not(:placeholder-shown) ~ .search-clear { display: flex; }
.result-stats {
    max-width: 1200px;
    margin: 6px auto 0;
    font-size: 12px;
    color: var(--text-secondary);
    padding: 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.result-stats .highlight { color: var(--accent); font-weight: 600; }
/* ===== Quick Nav ===== */
.quick-nav {
    max-width: 1200px;
    margin: 10px auto 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    cursor: grab;
    user-select: none;
}
.quick-nav.dragging { cursor: grabbing; scroll-behavior: auto; }
.quick-nav::-webkit-scrollbar { display: none; }
.nav-tag {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    font-weight: 500;
}
.nav-tag:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
}
.nav-tag.active {
    background: var(--gradient-accent);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 12px var(--accent-glow);
    font-weight: 600;
}
/* ===== Banner ===== */
.banner {
    max-width: 1200px;
    margin: 12px auto 8px;
    padding: 0 16px;
    position: relative;
}
.banner img {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    object-position: center 18%;
    border-radius: var(--radius);
    box-shadow: var(--shadow), 0 1px 3px rgba(0,0,0,0.04);
    display: block;
    background: linear-gradient(135deg, var(--accent-bg), var(--bg));
}
/* ===== Container ===== */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
}
/* ===== Category ===== */
.category {
    margin-bottom: 28px;
    scroll-margin-top: 140px;
    animation: fadeInUp 0.4s ease both;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}
.cat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid transparent;
    border-image: var(--gradient-accent);
    border-image-slice: 1;
    position: relative;
}
.cat-header::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0;
    width: 60px; height: 2px;
    background: var(--gradient-accent);
    border-radius: 1px;
}
.cat-header img {
    height: 28px;
    border-radius: 6px;
    background: #000;
}
.cat-header h2 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
}
.cat-count {
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 3px 10px;
    border-radius: 12px;
    margin-left: auto;
    font-weight: 600;
}
/* ===== Grid ===== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
}
.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s, border-color 0.3s;
    position: relative;
    animation: cardIn 0.3s ease both;
    box-shadow: var(--shadow-card);
}
@keyframes cardIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
}
.card:active { transform: scale(0.98); }
.card-thumb-wrap {
    position: relative;
    aspect-ratio: 16/10;
    background: #000;
    overflow: hidden;
    border-radius: 10px 10px 0 0;
}
.card-thumb-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.4));
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
}
.card:hover .card-thumb-wrap::after { opacity: 1; }
.card-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.card:hover .card-thumb { transform: scale(1.06); }
.card-thumb.loading {
    background: linear-gradient(90deg, #1a1a24 25%, #2a2a38 50%, #1a1a24 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
.card-info {
    padding: 6px 8px 8px;
}
.card-name {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 3px;
    letter-spacing: -0.1px;
    line-height: 1.3;
    max-height: 2.6em;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.card-cat {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 2px 8px;
    border-radius: 8px;
    display: inline-block;
    font-weight: 500;
}
.card-badge {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 6px;
    backdrop-filter: blur(8px);
    z-index: 2;
    font-weight: 500;
    letter-spacing: 0.3px;
    border: 1px solid rgba(255,255,255,0.08);
}
.card-badge[data-type="gif"] {
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    box-shadow: 0 2px 8px rgba(238,90,111,0.4);
    animation: badgePulse 2s ease-in-out infinite;
}
.card-badge[data-type="gif"]::before {
    content: '▶ ';
    font-size: 9px;
    opacity: 0.9;
}
@keyframes badgePulse {
    0%,100% { box-shadow: 0 2px 8px rgba(238,90,111,0.4); }
    50% { box-shadow: 0 2px 16px rgba(238,90,111,0.7); }
}
.fav-btn {
    position: absolute;
    top: 8px; left: 8px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    color: #ffd700;
    font-size: 14px;
    cursor: pointer;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    opacity: 0;
    transform: scale(0.8);
    -webkit-tap-highlight-color: transparent;
}
.card:hover .fav-btn,
.card:active .fav-btn {
    opacity: 1;
    transform: scale(1);
}
.fav-btn:hover {
    background: rgba(255,215,0,0.18);
    transform: scale(1.15) rotate(8deg);
}
.fav-btn.active {
    opacity: 1;
    transform: scale(1);
    background: rgba(255,215,0,0.2);
    color: #ffd700;
}
@media (max-width: 768px) {
    .fav-btn { opacity: 1; transform: scale(1); }
}
.card-count-badge {
    position: absolute;
    bottom: 8px; left: 8px;
    background: var(--gradient-accent);
    color: #fff;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 6px;
    backdrop-filter: blur(8px);
    z-index: 2;
    font-weight: 600;
    box-shadow: 0 2px 8px var(--accent-glow);
}
/* ===== Empty ===== */
.empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty button {
    margin-top: 16px;
    padding: 8px 20px;
    border: 1px solid var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
}
.empty button:hover { background: var(--accent); color: #fff; }
/* ===== Lightbox ===== */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 8px;
    backdrop-filter: blur(8px);
}
.lightbox.open { display: flex; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
.lightbox-content {
    max-width: 96vw;
    max-height: 96vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
    touch-action: pan-y;
}
.lightbox-content img {
    max-width: 100%;
    max-height: 88vh;
    border-radius: 10px;
    box-shadow: 0 0 60px rgba(108,92,231,0.3), 0 0 0 1px rgba(255,255,255,0.08);
    -webkit-user-drag: none;
    user-select: none;
    -webkit-touch-callout: none; /* iOS 禁用长按保存菜单 */
    -webkit-tap-highlight-color: transparent;
}
.lightbox-info {
    text-align: center;
    color: #fff;
    margin-top: 8px;
}
.lightbox-info h3 { font-size: 16px; margin-bottom: 2px; }
.lightbox-info p { font-size: 12px; opacity: 0.7; }
.lightbox-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
}
.lightbox-actions a, .lightbox-actions button {
    padding: 5px 12px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    line-height: 1.4;
}
.lightbox-actions a:hover, .lightbox-actions button:hover { background: rgba(255,255,255,0.3); }
.lightbox-close {
    position: absolute;
    top: 12px; right: 12px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.2s;
    z-index: 10;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}
.lightbox-close:hover { background: rgba(255,255,255,0.3); transform: rotate(90deg); }
.lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    z-index: 10;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    line-height: 1;
    padding: 0;
}
.lightbox-nav:hover { background: rgba(255,255,255,0.3); }
.lightbox-nav:active { background: rgba(255,255,255,0.45); transform: translateY(-50%) scale(0.95); }
.lightbox-prev { left: 8px; padding-right: 3px; }
.lightbox-next { right: 8px; padding-left: 3px; }
/* ===== Help Modal ===== */
.help-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
}
.help-modal.open { display: flex; animation: fadeIn 0.2s ease; }
.help-content {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.help-content h3 {
    font-size: 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.help-content ul { list-style: none; }
.help-content li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
}
.help-content li:last-child { border-bottom: none; }
.help-content kbd {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    font-family: monospace;
}
.help-close {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}
/* ===== Footer ===== */
.footer {
    text-align: center;
    padding: 40px 16px 10px;
    color: var(--text-secondary);
    font-size: 12px;
    position: relative;
}
.footer::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 2px;
    background: var(--gradient-accent);
    border-radius: 1px;
    opacity: 0.5;
}
.footer a { color: var(--accent); text-decoration: none; transition: opacity 0.2s; }
.footer a:hover { opacity: 0.7; }
/* ===== Scroll Top ===== */
.scroll-top {
    position: fixed;
    bottom: 20px; right: 20px;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--gradient-accent);
    color: #fff;
    border: none;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 20px var(--accent-glow);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    z-index: 50;
}
.scroll-top.visible { opacity: 1; visibility: visible; }
.scroll-top:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 6px 28px var(--accent-glow); }
.scroll-top:active { transform: translateY(-2px) scale(0.98); }
/* ===== Responsive ===== */
@media (max-width: 768px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .logo-text { font-size: 14px; }
    .logo-text small { font-size: 10px; }
    .cat-header h2 { font-size: 16px; }
    .search-shortcut { display: none; }
    .card-count-badge { display: none; }
    .header { padding-top: max(12px, env(safe-area-inset-top)); }
    .search-wrap input { font-size: 16px !important; } /* 防止iOS自动缩放 */
}
@media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card-info { padding: 8px 10px; }
    .card-name { font-size: 12px; }
    .card-cat { font-size: 10px; }
    .header { padding: 10px 12px 6px; padding-top: max(10px, env(safe-area-inset-top)); }
    .search-wrap input { font-size: 16px !important; padding: 10px 14px 10px 38px; min-height: 42px; }
    .nav-tag { font-size: 12px; padding: 5px 12px; min-height: 34px; display: inline-flex; align-items: center; }
    .lightbox-prev { left: 4px; }
    .lightbox-next { right: 4px; }
    .lightbox-nav { width: 52px; height: 52px; min-width: 52px; min-height: 52px; font-size: 26px; background: rgba(0,0,0,0.55); }
    .lightbox-close { top: 8px; right: 8px; width: 44px; height: 44px; min-width: 44px; min-height: 44px; font-size: 20px; }
    .lightbox-actions { gap: 4px; flex-wrap: wrap; justify-content: center; }
    .lightbox-actions a, .lightbox-actions button { padding: 8px 10px; font-size: 12px; min-height: 40px; }
    .card-count-badge { font-size: 9px; padding: 1px 6px; }
    .back-btn { padding: 8px 10px; font-size: 0; min-height: 38px; }
    .back-btn .arrow { font-size: 18px; }
    .theme-toggle, .help-btn { min-width: 38px; min-height: 38px; width: 38px; height: 38px; }
    .lightbox { padding: 0; padding-bottom: env(safe-area-inset-bottom); }
    .lightbox-content { max-width: 100vw; max-height: 100vh; }
    .lightbox-content img { max-height: 70vh; border-radius: 8px; }
    .lightbox-info { padding: 0 12px 8px; margin-top: 10px; }
    .lightbox-swipe-hint {
        display: block !important;
    }
    .scroll-top {
        bottom: max(16px, calc(env(safe-area-inset-bottom) + 12px));
        right: 12px;
    }
}
@media (max-width: 360px) {
    .grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="header">
    <div class="header-top">
        <div class="header-left">
            <a href="../index.html" class="back-btn" title="返回工具站" onclick="if(history.length>1){history.back();return false}" aria-label="返回主页">
                <span class="arrow">←</span> 返回
            </a>
            <div class="logo" id="logoBtn" title="回到顶部">
                <div class="logo-icon">Ae</div>
                <div class="logo-text">
                    文本动效速查手册
                    <small>320+ Text Animation Quick Reference</small>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button class="help-btn" id="helpBtn" aria-label="快捷键帮助">⌨️</button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
        </div>
    </div>
    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索动效名称或分类..." autocomplete="off">
        <button class="search-clear" id="searchClear" aria-label="清除">✕</button>
        <span class="search-shortcut">Ctrl+K</span>

    <div class="result-stats" id="resultStats"></div>
    <div class="quick-nav" id="quickNav"></div>
</header>

<div class="banner">
    <img src="images/banner-hd.png" alt="AE 文本动效速查手册封面">
</div>

<main class="container" id="app">
    <div id="content"></div>
</main>

<button class="scroll-top" id="scrollTop" aria-label="回到顶部">↑</button>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="动效放大查看">
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="上一个">‹</button>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="下一个">›</button>
    <div class="lightbox-content">
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-info">
            <h3 id="lightboxTitle"></h3>
            <p id="lightboxCat"></p>
            <div class="lightbox-swipe-hint" style="display:none;margin-top:4px;font-size:11px;opacity:0.45;color:#fff;letter-spacing:1px;user-select:none;pointer-events:none;">← 左右滑动切换 →</div>
            <div id="lightboxTextDisplay" style="margin:8px 0;padding:8px 12px;background:rgba(255,255,255,0.1);border-radius:8px;font-size:13px;color:#fff;min-height:20px;max-width:300px;word-break:break-all;display:none;"></div>
            <div class="lightbox-actions">
                <button id="lightboxFav" title="收藏 (L)">⭐ 收藏</button>
                <a id="lightboxDownload" href="" download>⬇️ 下载</a>
                <button id="lightboxCopyName">📋 复制名称</button>
                <button id="lightboxCopyText" style="display:none;">📋 复制文字</button>
            </div>
        </div>
    </div>
</div>

<div class="help-modal" id="helpModal">
    <div class="help-content">
        <h3>⌨️ 快捷键说明</h3>
        <ul>
            <li><span>聚焦搜索框</span><kbd>Ctrl + K</kbd> / <kbd>/</kbd></li>
            <li><span>收藏/取消收藏</span><kbd>L</kbd>（灯箱打开时）</li>
            <li><span>切换收藏筛选</span><kbd>Ctrl + L</kbd></li>
            <li><span>清除搜索</span><kbd>Esc</kbd>（搜索框聚焦时）</li>
            <li><span>关闭灯箱/弹窗</span><kbd>Esc</kbd></li>
            <li><span>上一个动效</span><kbd>←</kbd></li>
            <li><span>下一个动效</span><kbd>→</kbd></li>
            <li><span>回到顶部</span><kbd>Home</kbd></li>
        </ul>
        <button class="help-close" id="helpClose">知道了</button>
    </div>
</div>

<div class="footer">
    AE 文本动效速查手册 | 北受漫剪整理 | 共 <span id="footerCount">333</span> 个独立动效预览
</div>

<script>
// ================================================================
//  数据定义 - 从 cell_data.js 加载
// ================================================================
const CATEGORIES = (window.CELL_DATA && window.CELL_DATA.categories) ? window.CELL_DATA.categories : [];
const CELLS = (window.CELL_DATA && window.CELL_DATA.cells) ? window.CELL_DATA.cells : [];

// 收藏功能（持久化）
const FAV_STORAGE_KEY = 'ae-text-gallery-favorites';
let FAVORITES = new Set();
try {
    const saved = JSON.parse(localStorage.getItem(FAV_STORAGE_KEY) || '[]');
    if (Array.isArray(saved)) saved.forEach(i => FAVORITES.add(i));
} catch(_) {}
function saveFavorites() {
    try { localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(Array.from(FAVORITES))); } catch(_) {}
}
function toggleFavorite(index, btnEl) {
    if (FAVORITES.has(index)) {
        FAVORITES.delete(index);
        if (btnEl) { btnEl.textContent = '☆'; btnEl.classList.remove('active'); }
    } else {
        FAVORITES.add(index);
        if (btnEl) { btnEl.textContent = '⭐'; btnEl.classList.add('active'); }
    }
    saveFavorites();
    if (currentFilter === 'favorites') applyFilter();
    updateFavNavCount();
}
function updateFavNavCount() {
    const tag = quickNav.querySelector('[data-cat="favorites"]');
    if (tag) tag.textContent = '⭐ 收藏 (' + FAVORITES.size + ')';
}

// 使用独立单元格数据
let allItems = CELLS.map(cell => ({
    id: cell.id,
    name: cell.name,
    nameZh: cell.nameZh,
    nameEn: cell.nameEn || '',
    category: cell.category,
    categoryZh: cell.categoryZh,
    categoryId: cell.categoryId,
    image: cell.image,
    fileName: cell.fileName,
    sourceGif: cell.sourceGif,
    ocrTexts: cell.ocrTexts || [],
    index: cell.index
}));

// ================================================================
//  DOM 引用
// ================================================================
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const resultStats = document.getElementById('resultStats');
const quickNav = document.getElementById('quickNav');
const content = document.getElementById('content');
const themeToggle = document.getElementById('themeToggle');
const helpBtn = document.getElementById('helpBtn');
const helpModal = document.getElementById('helpModal');
const helpClose = document.getElementById('helpClose');
const logoBtn = document.getElementById('logoBtn');
const scrollTopBtn = document.getElementById('scrollTop');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxTitle = document.getElementById('lightboxTitle');
const lightboxCat = document.getElementById('lightboxCat');
const lightboxClose = document.getElementById('lightboxClose');
const lightboxPrev = document.getElementById('lightboxPrev');
const lightboxNext = document.getElementById('lightboxNext');
const lightboxDownload = document.getElementById('lightboxDownload');
const lightboxCopyName = document.getElementById('lightboxCopyName');
const lightboxCopyText = document.getElementById('lightboxCopyText');
const lightboxTextDisplay = document.getElementById('lightboxTextDisplay');
const lightboxFav = document.getElementById('lightboxFav');
const footerCount = document.getElementById('footerCount');

let currentFilter = 'all';
let currentLightboxIndex = 0;
let filteredItems = [...allItems];

footerCount.textContent = allItems.length;

// ================================================================
//  主题切换
// ================================================================
function initTheme() {
    const saved = localStorage.getItem('ae-theme');
    const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
}
themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('ae-theme', next);
});
initTheme();

// ================================================================
//  帮助弹窗
// ================================================================
helpBtn.addEventListener('click', () => helpModal.classList.add('open'));
helpClose.addEventListener('click', () => helpModal.classList.remove('open'));
helpModal.addEventListener('click', (e) => {
    if (e.target === helpModal) helpModal.classList.remove('open');
});

// ================================================================
//  渲染导航
// ================================================================
function renderNav() {
    let html = '<button class="nav-tag active" data-cat="all">全部 (' + allItems.length + ')</button>';
    html += '<button class="nav-tag" data-cat="favorites" style="border-color:#ffd700;color:#e0b800;">⭐ 收藏 (' + FAVORITES.size + ')</button>';
    CATEGORIES.forEach(cat => {
        const catCount = CELLS.filter(c => c.categoryId === cat.id).length;
        if (catCount > 0) {
            html += '<button class="nav-tag" data-cat="' + cat.id + '">' + cat.nameZh + ' (' + catCount + ')</button>';
        }
    });
    quickNav.innerHTML = html;
    quickNav.querySelectorAll('.nav-tag').forEach(tag => {
        tag.addEventListener('click', () => {
            quickNav.querySelectorAll('.nav-tag').forEach(t => t.classList.remove('active'));
            tag.classList.add('active');
            currentFilter = tag.dataset.cat;
            applyFilter();
            if (currentFilter !== 'all' && currentFilter !== 'favorites') {
                const el = document.getElementById('cat-' + currentFilter);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    });
}

// ================================================================
//  渲染内容
// ================================================================
function renderContent() {
    if (filteredItems.length === 0) {
        let emptyIcon = '🔍', emptyTitle = '没有找到匹配的动效', emptyDesc = '试试其他关键词', btnText = '清除搜索';
        if (currentFilter === 'favorites') {
            emptyIcon = '☆';
            emptyTitle = '还没有收藏的动效';
            emptyDesc = '点击卡片左上角 ⭐ 可收藏喜欢的动效';
            btnText = '查看全部';
        }
        content.innerHTML = '<div class="empty"><div class="empty-icon">' + emptyIcon + '</div><p>' + emptyTitle + '</p><p style="font-size:12px;margin-top:8px;">' + emptyDesc + '</p><button id="clearSearchBtn">' + btnText + '</button></div>';
        document.getElementById('clearSearchBtn').addEventListener('click', () => {
            searchInput.value = '';
            currentFilter = 'all';
            quickNav.querySelectorAll('.nav-tag').forEach(t => t.classList.remove('active'));
            const allTag = quickNav.querySelector('[data-cat="all"]');
            if (allTag) allTag.classList.add('active');
            applyFilter();
        });
        return;
    }

    // 按分类分组
    const grouped = {};
    filteredItems.forEach(item => {
        if (!grouped[item.categoryId]) grouped[item.categoryId] = [];
        grouped[item.categoryId].push(item);
    });

    let html = '';
    let catIdx = 0;
    CATEGORIES.forEach(cat => {
        if (cat.items && cat.items.length === 0) return;
        if (grouped[cat.id] && grouped[cat.id].length > 0) {
            html += '<section class="category" id="cat-' + cat.id + '" style="animation-delay:' + (catIdx * 0.05) + 's">';
            html += '<div class="cat-header">';
            html += '<img src="images/' + cat.cover + '" alt="' + cat.nameZh + '" loading="lazy">';
            html += '<h2>' + cat.nameZh + '</h2>';
            html += '<span class="cat-count">' + grouped[cat.id].length + ' 个动效</span>';
            html += '</div>';
            html += '<div class="grid">';
            grouped[cat.id].forEach((item, i) => {
                var _ext = item.image.split('.').pop().toLowerCase();
                var _badge = ({webp:'WebP',gif:'GIF',jpg:'JPG',jpeg:'JPG',png:'PNG'})[_ext] || _ext.toUpperCase();
                var _isFav = FAVORITES.has(item.index);
                html += '<div class="card" data-index="' + item.index + '" style="animation-delay:' + (i * 0.02) + 's">';
                html += '<div class="card-thumb-wrap">';
                html += '<img class="card-thumb loading" src="' + item.image + '" alt="' + item.nameZh + '" loading="lazy" onload="this.classList.remove(\'loading\')" onerror="handleImgError(this)">';
                html += '<span class="card-badge" data-type="' + _ext + '">' + _badge + '</span>';
                html += '<button class="fav-btn" data-fav="' + item.index + '" aria-label="收藏" title="收藏">' + (_isFav ? '⭐' : '☆') + '</button>';
                html += '</div>';
                html += '<div class="card-info">';
                html += '<div class="card-name" title="' + item.nameZh + '">' + item.nameZh + '</div>';
                html += '<span class="card-cat">' + item.categoryZh + '</span>';
                html += '</div></div>';
            });
            html += '</div></section>';
            catIdx++;
        }
    });
    content.innerHTML = html;

    // 绑定收藏按钮（阻止冒泡，避免触发卡片点击）
    content.querySelectorAll('.fav-btn').forEach(btn => {
        if (FAVORITES.has(parseInt(btn.dataset.fav))) btn.classList.add('active');
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            toggleFavorite(parseInt(btn.dataset.fav), btn);
        });
    });

    // 绑定卡片点击
    content.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => {
            openLightbox(parseInt(card.dataset.index));
        });
    });

    // 重新观察新渲染的分类元素（修复搜索后Observer失效）
    if (window._catObserver) {
        window._catObserver.disconnect();
        content.querySelectorAll('.category').forEach(cat => window._catObserver.observe(cat));
    }
}

// ================================================================
//  搜索与筛选
// ================================================================
function applyFilter() {
    const keyword = searchInput.value.trim().toLowerCase();
    filteredItems = allItems.filter(item => {
        let matchCat = currentFilter === 'all' || item.categoryId === currentFilter;
        if (currentFilter === 'favorites') matchCat = FAVORITES.has(item.index);
        const matchKw = !keyword ||
            item.name.toLowerCase().includes(keyword) ||
            item.nameZh.includes(keyword) ||
            item.category.toLowerCase().includes(keyword) ||
            item.categoryZh.includes(keyword) ||
            item.fileName.toLowerCase().includes(keyword) ||
            (item.ocrTexts && item.ocrTexts.some(t => t.toLowerCase().includes(keyword)));
        return matchCat && matchKw;
    });

    if (keyword) {
        resultStats.innerHTML = '找到 <span class="highlight">' + filteredItems.length + '</span> 个动效';
    } else if (currentFilter === 'favorites') {
        resultStats.innerHTML = '⭐ 收藏 · <span class="highlight">' + filteredItems.length + '</span> 个动效';
    } else if (currentFilter !== 'all') {
        const cat = CATEGORIES.find(c => c.id === currentFilter);
        resultStats.innerHTML = cat ? cat.nameZh + ' · <span class="highlight">' + filteredItems.length + '</span> 个动效' : '';
    } else {
        resultStats.innerHTML = '共 <span class="highlight">' + allItems.length + '</span> 个独立动效预览';
    }
    renderContent();
}

let searchTimer = null;
searchInput.addEventListener('input', () => {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilter, 150);
});
searchClear.addEventListener('click', () => {
    searchInput.value = '';
    applyFilter();
    searchInput.focus();
});

// ================================================================
//  灯箱（修复索引匹配bug）
// ================================================================
function openLightbox(itemIndex) {
    // 修复：找到item在filteredItems中的实际位置
    const pos = filteredItems.findIndex(item => item.index === itemIndex);
    currentLightboxIndex = pos >= 0 ? pos : 0;
    updateLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
}
function updateLightbox() {
    const item = filteredItems[currentLightboxIndex];
    if (!item) return;
    lightboxImg.onerror = function() {
        lightboxImg.onerror = null;
        lightboxImg.style.display = 'none';
    };
    lightboxImg.src = item.image;
    lightboxImg.alt = item.nameZh;
    lightboxImg.style.display = '';
    lightboxTitle.textContent = item.nameZh;
    lightboxCat.textContent = item.categoryZh + ' · ' + (currentLightboxIndex + 1) + ' / ' + filteredItems.length + ' 个';
    // 移动端显示滑动提示
    const swipeHint = document.querySelector('.lightbox-swipe-hint');
    if (swipeHint && 'ontouchstart' in window) {
        swipeHint.style.display = 'block';
    }
    lightboxDownload.href = item.image;
    lightboxDownload.download = item.fileName;
    // 更新OCR文字显示
    const ocrTexts = item.ocrTexts || [];
    if (ocrTexts.length > 0) {
        lightboxTextDisplay.style.display = 'block';
        lightboxTextDisplay.textContent = '📝 识别文字: ' + ocrTexts.join(' | ');
        lightboxCopyText.style.display = 'inline-block';
    } else {
        lightboxTextDisplay.style.display = 'none';
        lightboxCopyText.style.display = 'none';
    }
    // 更新复制名称按钮文字
    lightboxCopyName.textContent = '📋 复制名称';
    // 更新收藏按钮
    const isFav = FAVORITES.has(item.index);
    lightboxFav.textContent = isFav ? '⭐ 已收藏' : '☆ 收藏';
    lightboxFav.style.background = isFav ? 'rgba(255,215,0,0.25)' : '';
    lightboxFav.style.color = isFav ? '#ffd700' : '';
    lightboxFav.style.borderColor = isFav ? '#ffd700' : '';
}
function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
}
function prevLightbox() {
    currentLightboxIndex = (currentLightboxIndex - 1 + filteredItems.length) % filteredItems.length;
    updateLightbox();
}
function nextLightbox() {
    currentLightboxIndex = (currentLightboxIndex + 1) % filteredItems.length;
    updateLightbox();
}
function toggleLightboxFav() {
    const item = filteredItems[currentLightboxIndex];
    if (!item) return;
    toggleFavorite(item.index, null);
    updateLightbox();
    // 同步更新卡片上的按钮状态
    const cardBtn = content.querySelector('.fav-btn[data-fav="' + item.index + '"]');
    if (cardBtn) {
        const fav = FAVORITES.has(item.index);
        cardBtn.textContent = fav ? '⭐' : '☆';
        cardBtn.classList.toggle('active', fav);
    }
}
lightboxClose.addEventListener('click', closeLightbox);
lightboxPrev.addEventListener('click', prevLightbox);
lightboxNext.addEventListener('click', nextLightbox);
lightboxFav.addEventListener('click', toggleLightboxFav);
// ===== 移动端滑动手势切换 =====
(function() {
    var touchStartX = 0, touchStartY = 0, touchStartTime = 0;
    var isSwiping = false;
    var SWIPE_THRESHOLD = 50;   // 最小滑动距离（px）
    var SWIPE_TIME = 500;       // 最长滑动时间（ms）
    var VERT_LOCK = 30;         // 垂直偏移超过此值视为滚动，不作为切换
    lightbox.addEventListener('touchstart', function(e) {
        if (!lightbox.classList.contains('open') || e.touches.length !== 1) return;
        var t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchStartTime = Date.now();
        isSwiping = true;
    }, { passive: true });
    lightbox.addEventListener('touchmove', function(e) {
        if (!isSwiping) return;
        // 可选：减少默认滚动干扰，但不 preventDefault 以免影响页面
    }, { passive: true });
    lightbox.addEventListener('touchend', function(e) {
        if (!isSwiping) return;
        isSwiping = false;
        if (!lightbox.classList.contains('open')) return;
        var changedTouch = e.changedTouches && e.changedTouches[0];
        if (!changedTouch) return;
        var dx = changedTouch.clientX - touchStartX;
        var dy = changedTouch.clientY - touchStartY;
        var dt = Date.now() - touchStartTime;
        if (dt > SWIPE_TIME) return;
        if (Math.abs(dy) > VERT_LOCK) return;          // 垂直滑动，忽略（当作滚动）
        if (Math.abs(dx) < SWIPE_THRESHOLD) return;    // 太短，忽略
        if (dx < 0) nextLightbox(); else prevLightbox();
    }, { passive: true });
})();
lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
});
lightboxImg.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const item = filteredItems[currentLightboxIndex];
    if (!item) return;
    const a = document.createElement('a');
    a.href = item.image;
    a.download = item.fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
});
lightboxCopyName.addEventListener('click', () => {
    const item = filteredItems[currentLightboxIndex];
    if (!item) return;
    function showCopied() {
        lightboxCopyName.textContent = '✅ 已复制';
        setTimeout(() => lightboxCopyName.textContent = '📋 复制名称', 1500);
    }
    function fallbackCopy() {
        try {
            var ta = document.createElement('textarea');
            ta.value = item.nameZh;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showCopied();
        } catch(e) {
            lightboxCopyName.textContent = '❌ 复制失败';
            setTimeout(() => lightboxCopyName.textContent = '📋 复制名称', 1500);
        }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(item.nameZh).then(showCopied).catch(fallbackCopy);
    } else {
        fallbackCopy();
    }
});
lightboxCopyText.addEventListener('click', () => {
    const item = filteredItems[currentLightboxIndex];
    if (!item) return;
    const ocrTexts = item.ocrTexts || [];
    if (ocrTexts.length === 0) return;
    const text = ocrTexts.join('\n');
    function showCopied() {
        lightboxCopyText.textContent = '✅ 已复制';
        setTimeout(() => lightboxCopyText.textContent = '📋 复制文字', 1500);
    }
    function fallbackCopy() {
        try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showCopied();
        } catch(e) {
            lightboxCopyText.textContent = '❌ 复制失败';
            setTimeout(() => lightboxCopyText.textContent = '📋 复制文字', 1500);
        }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
    } else {
        fallbackCopy();
    }
});

// ================================================================
//  全局键盘快捷键
// ================================================================
document.addEventListener('keydown', (e) => {
    // 灯箱打开时
    if (lightbox.classList.contains('open')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevLightbox();
        if (e.key === 'ArrowRight') nextLightbox();
        if ((e.key === 'l' || e.key === 'L') && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            toggleLightboxFav();
        }
        return;
    }
    // 帮助弹窗打开时
    if (helpModal.classList.contains('open')) {
        if (e.key === 'Escape') helpModal.classList.remove('open');
        return;
    }
    // 搜索框聚焦时
    if (document.activeElement === searchInput) {
        if (e.key === 'Escape') {
            searchInput.value = '';
            applyFilter();
            searchInput.blur();
        }
        return;
    }
    // Ctrl+L 切换收藏筛选
    if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')) {
        e.preventDefault();
        const favTag = quickNav.querySelector('[data-cat="favorites"]');
        if (favTag) favTag.click();
        return;
    }
    // 全局快捷键：Ctrl+K (标准搜索)，/ 作为备用，Ctrl+F 仍然支持但提示改用 Ctrl+K
    const isSearchShortcut =
        ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) ||
        e.key === '/' ||
        ((e.ctrlKey || e.metaKey) && e.key === 'f');
    if (isSearchShortcut) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
    }
    if (e.key === 'Home') {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
});

// ================================================================
//  回到顶部 & Logo点击
// ================================================================
window.addEventListener('scroll', () => {
    if (window.scrollY > 400) {
        scrollTopBtn.classList.add('visible');
    } else {
        scrollTopBtn.classList.remove('visible');
    }
});
scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});
logoBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ================================================================
//  滚动时自动高亮分类导航
// ================================================================
window._catObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting && currentFilter === 'all' && !searchInput.value) {
            const catId = entry.target.id.replace('cat-', '');
            quickNav.querySelectorAll('.nav-tag').forEach(t => t.classList.remove('active'));
            const tag = quickNav.querySelector('[data-cat="' + catId + '"]');
            if (tag) {
                tag.classList.add('active');
                tag.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
    });
}, { rootMargin: '-150px 0px -60% 0px', threshold: 0 });

// 延迟启动observer，等内容渲染完成
setTimeout(() => {
    document.querySelectorAll('.category').forEach(cat => window._catObserver.observe(cat));
}, 500);

// ================================================================
//  导航栏拖拽滚动（桌面端）
// ================================================================
(function() {
    let isDown = false, startX, scrollLeft, moved = false;
    quickNav.addEventListener('mousedown', (e) => {
        isDown = true;
        moved = false;
        quickNav.classList.add('dragging');
        startX = e.pageX - quickNav.offsetLeft;
        scrollLeft = quickNav.scrollLeft;
    });
    quickNav.addEventListener('mouseleave', () => {
        isDown = false;
        quickNav.classList.remove('dragging');
    });
    quickNav.addEventListener('mouseup', () => {
        isDown = false;
        quickNav.classList.remove('dragging');
    });
    quickNav.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - quickNav.offsetLeft;
        const delta = x - startX;
        if (Math.abs(delta) > 4) moved = true;
        quickNav.scrollLeft = scrollLeft - delta;
    });
    // 触摸事件支持（移动端拖拽滚动）
    quickNav.addEventListener('touchstart', (e) => {
        isDown = true;
        moved = false;
        startX = e.touches[0].pageX - quickNav.offsetLeft;
        scrollLeft = quickNav.scrollLeft;
    }, { passive: true });
    quickNav.addEventListener('touchmove', (e) => {
        if (!isDown) return;
        const x = e.touches[0].pageX - quickNav.offsetLeft;
        const delta = x - startX;
        // 仅在水平拖拽时阻止默认滚动，避免影响页面竖向滚动
        if (Math.abs(delta) > 4) {
            moved = true;
            e.preventDefault();
        }
        quickNav.scrollLeft = scrollLeft - delta;
    }, { passive: false });
    quickNav.addEventListener('touchend', () => {
        isDown = false;
    });
    // 拖拽后阻止点击事件触发分类切换
    quickNav.addEventListener('click', (e) => {
        if (moved) {
            e.preventDefault();
            e.stopPropagation();
            moved = false;
        }
    }, true);
})();

// ================================================================
//  全局图片加载错误处理
// ================================================================
function handleImgError(img) {
    if (!img || img.dataset.errHandled) return;
    img.dataset.errHandled = '1';
    img.classList.remove('loading');
    img.style.background = '#1a1a24';
    img.style.visibility = 'hidden';
    var placeholder = document.createElement('div');
    placeholder.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:11px;background:#1a1a24;';
    placeholder.textContent = '图片加载失败';
    if (img.parentElement) img.parentElement.appendChild(placeholder);
}
window.handleImgError = handleImgError;

// ================================================================
//  初始化
// ================================================================
renderNav();
applyFilter();
</script>
